name: Importar vídeos do hero
on:
  push:
    paths: ['.github/workflows/import-hero.yml']
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar, comprimir e gerar loops
        run: |
          set -euo pipefail
          mkdir -p assets/video /tmp/in
          curl -fsSL -o /tmp/in/wide.mp4 "https://pikaso.cdnpk.net/private/production/5965396295/bfb31159-5e75-491f-a7b4-50221edf70ce-0.mp4?token=exp=1794182400~hmac=9dcb89548d927229afe07b6390bbe0c15d8250587762466eeacc1879cb79472d"
          curl -fsSL -o /tmp/in/tall.mp4 "https://pikaso.cdnpk.net/private/production/5965394884/1c83581b-bdce-4f4f-b5b1-48f9ee2f83e6-0.mp4?token=exp=1794182400~hmac=c270dfc70e087082029719a5df061ba6d24921e4f93bfe089533e006e5fa1d83"
          loop() { ffmpeg -y -loglevel error -i "$1" -an -filter_complex "[0:v]split[a][b];[b]reverse[r];[a][r]concat=n=2:v=1[v]" -map "[v]" -c:v libx264 -crf "$3" -preset veryfast -pix_fmt yuv420p -movflags +faststart "$2"; }
          loop /tmp/in/wide.mp4 assets/video/hero-wide.mp4 30
          loop /tmp/in/tall.mp4 assets/video/hero-tall.mp4 28
          ffmpeg -y -loglevel error -ss 2 -i /tmp/in/wide.mp4 -frames:v 1 -vf scale=1280:-2 -c:v libwebp -quality 72 assets/video/hero-poster.webp
          ffmpeg -y -loglevel error -ss 2.5 -i /tmp/in/tall.mp4 -frames:v 1 -c:v libwebp -quality 72 assets/video/hero-poster-tall.webp
          ls -la assets/video
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video
          git commit -m "Hero: vídeos de fundo (desktop e mobile) e posters"
          git push
